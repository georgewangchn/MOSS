# OntologyOps "Ontology Repo" 符合性条款（语义级，格式无关）。
# 判定一个本体/实现是否符合协议 (见 PROTOCOL.md)。
# 由 moss/ontorepo/conformance.py 执行；`moss onto conformance` 呈现。
#
# 每条标注 profile：
#   core       —— 领域中立的核心机制层（§1，任何领域都须满足）
#   governance —— Governance Profile（§2.1，MOSS 满足）
# 一个实现的符合性 = 通过全部 core 条款 + 其目标 profile 的条款。
protocol: ontologyops
version: "1.0"
clauses:
  # ── 核心机制层（领域中立） ──
  - id: core-encodable
    profile: core
    desc: "本体必须能被某种编码的 schema 校验通过 (R1)"
    check: schema_valid

  - id: core-result-keys
    profile: core
    desc: "必须以 result_key 暴露可被推理机判定的语义分类 (R3 机制)"
    check: declares_result_keys

  - id: core-interop-turtle
    profile: core
    desc: "必须能导出可被解析的标准 W3C Turtle (R5)"
    check: ttl_parses

  # ── Governance Profile（企业决策治理领域） ──
  - id: gov-core-concept
    profile: governance
    desc: "必须定义核心概念 Decision / Issue / Update (G1)"
    check: has_concepts
    args: {required: [Decision, Issue, Update]}

  - id: gov-governed-semantics
    profile: governance
    desc: "必须存在等价于 owner∧deadline∧update 的 governed 定义类 (G2)"
    check: has_defined_class_equiv
    args: {result_key: governed, properties: [hasOwner, hasDeadline, hasUpdate]}

  - id: gov-priority-value-class
    profile: governance
    desc: "必须存在由优先级值约束驱动的关键类 (P0/P1) (G3)"
    check: has_value_restriction
    args: {property: hasPriority, values: [P0, P1]}

  - id: gov-risk-value-class
    profile: governance
    desc: "高风险决策必须由 risk_level 值约束定义"
    check: has_value_restriction
    args: {property: hasRiskLevel, values: [HIGH]}

  - id: gov-status-value-class
    profile: governance
    desc: "阻塞/完成状态必须由 status 值约束定义"
    check: has_value_restriction
    args: {property: hasStatus, values: [BLOCKED, DONE]}

  - id: gov-severity-value-class
    profile: governance
    desc: "关键议题必须由 severity 值约束定义"
    check: has_value_restriction
    args: {property: hasSeverity, values: [CRITICAL]}

  - id: gov-dependency-object-property
    profile: governance
    desc: "决策间依赖必须是 Decision→Decision 对象属性（而非字符串字段）"
    check: has_object_property
    args: {name: dependsOn, domain: Decision, range: Decision}

  - id: gov-blocked-dependency-semantics
    profile: governance
    desc: "必须存在『依赖了阻塞决策』的定义类 (blocked_dependency)"
    check: has_defined_class_equiv
    args: {result_key: blocked_dependency, properties: [dependsOn]}

  - id: gov-overdue-semantics
    profile: governance
    desc: "必须存在超期定义类 (overdue)，时间语义经 computed 布尔桥接"
    check: has_defined_class_equiv
    args: {result_key: overdue, properties: [isOverdue]}

  - id: gov-stale-update-semantics
    profile: governance
    desc: "必须存在停滞更新定义类 (stale_update)"
    check: has_defined_class_equiv
    args: {result_key: stale_update, properties: [isStaleUpdate]}

  - id: gov-org-vocabulary
    profile: governance
    desc: "必须声明分层组织词汇表（通用岗位 + 典型公司原型，L0-L3）"
    check: declares_org_vocabulary
    args:
      min_universal_positions: 5
      required_archetypes: [pharma, hospital, battery, internet-med]
      min_positions_per_archetype: 3

  - id: gov-domain-value-class
    profile: governance
    desc: "质量/合规通用业务域必须由 hasDomain 值约束定义"
    check: has_value_restriction
    args: {property: hasDomain, values: [质量, 合规]}

  - id: gov-role-alignment-semantics
    profile: governance
    desc: "必须存在岗位对齐三分类（role_aligned / role_misaligned / role_unregistered，均经 computed 布尔正向断言）"
    check: has_defined_class_equiv
    args: {result_key: role_misaligned, properties: [isRoleMisaligned]}

  - id: gov-industry-specialized-classes
    profile: governance
    desc: "行业特化定义类必须由 hasIndustry ∧ hasDomain 值约束组合定义"
    check: has_value_restriction
    args: {property: hasIndustry, values: [医药, 医疗, 汽车, 互联网]}

  - id: gov-reasoner-keys
    profile: governance
    desc: "推理必须产出治理语义 result_key (G2/G3 及 Profile 增强)"
    check: reasoner_result_keys
    args: {keys: [governed, has_owner, has_deadline, critical, high_priority, high_risk, blocked, done, overdue, stale, critical_issue, stale_update, has_dependency, blocked_dependency, domain_quality, domain_compliance, pharma_gmp_production, hospital_medical_affairs, battery_safety, internet_med_content_compliance, role_aligned, role_misaligned, role_unregistered]}
