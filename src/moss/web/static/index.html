<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MOSS 治理驾驶舱</title>
<style>
:root{--bg:#060b10;--card:#0d1520;--border:#2a3a50;--text:#d0deee;--dim:#9aacbf;--accent:#5cb8ff;
  --green:#2ecc71;--yellow:#f0c040;--red:#e74c3c;--purple:#9b59b6;
  --p0:#e74c3c;--p1:#f0c040;--p2:#4da6ff;--p3:#9aacbf;--p4:#7a8a9a}
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.5 'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;padding:6px 16px;border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;background:var(--card)}
header h1{font-size:14px;font-weight:700}
header h1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
header .stat{font-size:10px;color:var(--dim);padding:2px 8px;background:rgba(255,255,255,.03);border-radius:3px;border:1px solid var(--border)}
header .stat b{color:var(--text);font-size:12px}
header .clock{font-size:11px;color:var(--dim);margin-left:auto}

.input-bar{display:flex;gap:8px;padding:6px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--card)}
.input-bar input{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;font:inherit}
.input-bar input:focus{outline:none;border-color:var(--accent)}
.input-bar button{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font:inherit;font-size:11px;font-weight:600}
.input-bar .btn-go{background:var(--accent);color:#fff}
.input-bar .btn-cp{background:var(--purple);color:#fff}
.input-bar select{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font:inherit;font-size:11px}

main{flex:1;display:flex;flex-direction:column;gap:4px;padding:4px}

/* ── Panels ── */
.panel{background:var(--card);border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column}
.panel.highlight{border-left:2px solid var(--red)}
.panel-header{padding:6px 10px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--dim);letter-spacing:1px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.panel-header .count{font-size:9px;font-weight:400;color:var(--accent)}
.panel-body{overflow-y:auto;padding:6px 8px}
.panel-body.nopad{padding:0}

/* ── Top Row ── */
.top-row{display:grid;grid-template-columns:3fr 2fr;gap:6px;min-height:220px}

/* ── Decision Board ── */
.board-tabs{display:flex;gap:2px;padding:4px 8px 0 8px}
.board-tab{padding:3px 10px;border-radius:4px 4px 0 0;font-size:10px;cursor:pointer;color:var(--dim);background:rgba(255,255,255,.02);border:1px solid transparent;border-bottom:none}
.board-tab.active{color:var(--accent);background:var(--card);border-color:var(--border)}
.decision-row{display:flex;align-items:center;gap:6px;padding:4px 8px;margin:1px 0;border-radius:3px;border-left:2px solid transparent;cursor:pointer;font-size:11px}
.decision-row:hover{background:rgba(255,255,255,.03)}
.decision-row.critical{border-left-color:var(--red);box-shadow:0 0 4px rgba(231,76,60,.15)}
.decision-row.error{border-left-color:var(--red);background:rgba(231,76,60,.04)}
.decision-row.warning{border-left-color:var(--yellow)}
.decision-row.ok{border-left-color:var(--green)}
.decision-row.done{opacity:.6}
.decision-row .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.decision-row .title.alerted{color:var(--red);font-weight:600}
.badge{font-size:8px;padding:1px 4px;border-radius:2px;font-weight:700}
.bg-p0{background:var(--p0);color:#fff}.bg-p1{background:var(--p1);color:#000}.bg-p2{background:var(--p2);color:#fff}.bg-p3{background:var(--p3);color:var(--dim)}.bg-p4{background:var(--p4);color:var(--dim)}
.pbar{width:32px;height:2px;background:var(--border);border-radius:1px;overflow:hidden;flex-shrink:0}.pbar-fill{height:100%;border-radius:1px}
.sdot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:2px;flex-shrink:0}
.dot-OPEN{background:var(--dim)}.dot-BLOCKED{background:var(--red)}.dot-RUNNING{background:var(--accent)}.dot-DONE{background:var(--green)}
.alert-dot{display:inline-block;width:4px;height:4px;border-radius:50%;margin-right:2px;animation:pulse 1s infinite}
.alert-dot-HIGH{background:var(--red)}.alert-dot-MEDIUM{background:var(--yellow)}
.inline-alert{font-size:9px;padding:1px 4px;border-radius:2px;white-space:nowrap}
.inline-alert-HIGH{background:rgba(231,76,60,.15);color:var(--red)}
.inline-alert-MEDIUM{background:rgba(240,192,64,.1);color:var(--yellow)}

/* ── Alerts Panel ── */
.notif-row{display:flex;align-items:flex-start;gap:5px;padding:4px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,.02)}
.notif-row .icon{font-size:13px;width:14px;text-align:center;flex-shrink:0}
.alert-card{padding:5px 7px;margin-bottom:2px;border-radius:3px;font-size:11px;border-left:2px solid;cursor:pointer}
.alert-card:hover{background:rgba(255,255,255,.02)}
.alert-HIGH{border-color:var(--red);background:rgba(231,76,60,.04)}.alert-MEDIUM{border-color:var(--yellow);background:rgba(240,192,64,.03)}
.box{border:1px solid var(--border);border-radius:3px;padding:6px;margin-bottom:4px;font-size:10px}
.box .st,.st{font-size:9px;font-weight:700;color:var(--dim);margin-bottom:3px;letter-spacing:1px}
.box.error{border-color:var(--red);background:rgba(231,76,60,.03)}

/* ── HermiT ── */
.hermit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.hcell{text-align:center;padding:6px 4px;border-radius:3px;background:rgba(255,255,255,.02);cursor:pointer}
.hcell:hover{background:rgba(255,255,255,.04)}
.hcell .num{font-size:18px;font-weight:700}.hcell .label{font-size:9px;color:var(--dim);margin-top:1px}
.hermit-detail{margin-top:6px}
.hermit-detail .st{font-size:9px;font-weight:700;color:var(--dim);margin-bottom:4px;letter-spacing:1px}
.priority-spectrum{display:flex;align-items:center;height:24px;border-radius:3px;overflow:hidden;margin-bottom:8px;background:var(--border)}
.priority-spectrum .pseg{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;transition:filter .2s;cursor:default}
.priority-spectrum .pseg:hover{filter:brightness(1.3)}
.priority-spectrum .pseg.empty{opacity:.3}
.compile-line{padding:1px 0;font-size:10px;cursor:pointer}.compile-line:hover{background:rgba(255,255,255,.02)}
.priority-row{display:flex;align-items:center;gap:4px;padding:1px 0;font-size:10px}
.priority-row .bar{flex:1;height:7px;background:var(--border);border-radius:1px;overflow:hidden;display:flex}
.priority-row .bar span{height:100%}

/* ── Events ── */
.log-tabs{display:flex;gap:4px;padding:4px 8px}
.log-tab{padding:2px 8px;border-radius:3px;font-size:10px;cursor:pointer;color:var(--dim);border:1px solid var(--border)}
.log-tab.active{color:var(--accent);border-color:var(--accent);background:rgba(77,166,255,.06)}
.log-entry{padding:2px 0;font-size:10px;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid transparent}
.log-info{border-color:var(--accent)}.log-warn{border-color:var(--yellow)}.log-error{border-color:var(--red)}.log-sync{border-color:var(--green)}
.log-highlight{border-color:var(--accent);background:rgba(77,166,255,.04)}
.log-entry .ts{color:var(--dim);margin-right:4px;font-size:9px}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}
.detail-overlay{position:fixed;top:0;right:0;width:420px;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:100;transform:translateX(100%);transition:transform .3s;overflow-y:auto;padding:14px;box-shadow:-4px 0 20px rgba(0,0,0,.4)}
.detail-overlay.open{transform:translateX(0)}
.detail-overlay .close{position:absolute;top:10px;right:14px;font-size:16px;cursor:pointer;color:var(--dim)}
.detail-overlay h3{font-size:14px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.detail-field{display:flex;padding:3px 0;font-size:11px}.detail-field .label{color:var(--dim);width:60px;flex-shrink:0}
.detail-update{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:10px}
.detail-update .ts{color:var(--dim);font-size:9px}
.detail-update .src-badge{display:inline-block;font-size:8px;padding:1px 5px;border-radius:2px;margin-left:4px;vertical-align:middle}
.src-web{background:rgba(77,166,255,.15);color:var(--accent)}.src-cli{background:rgba(155,89,182,.15);color:var(--purple)}.src-ingest{background:rgba(46,204,113,.15);color:var(--green)}
.detail-update .delta{font-size:9px;margin-top:2px;color:var(--dim)}
.delta-up{color:var(--green)}.delta-down{color:var(--red)}
.hermit-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.hermit-stat{cursor:pointer;text-align:center;padding:8px 4px;border-radius:4px;background:rgba(255,255,255,.02);border:1px solid transparent;transition:border-color .2s}
.hermit-stat:hover{background:rgba(255,255,255,.04);border-color:var(--border)}
.hermit-stat .num{font-size:20px;font-weight:700}.hermit-stat .label{font-size:9px;color:var(--dim);margin-top:2px}
.hermit-stat.warn{border-color:rgba(240,192,64,.2)}.hermit-stat.err{border-color:rgba(231,76,60,.2)}
.priority-wrap{margin-top:8px;position:relative}
.compile-wrap{margin-top:6px;max-height:140px;overflow-y:auto}
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>MOSS</h1>
  <span class="stat">决策<b id="sTotal">-</b></span>
  <span class="stat">高危<b id="sHigh" style="color:var(--red)">-</b></span>
  <span class="stat">超期<b id="sOverdue" style="color:var(--yellow)">-</b></span>
  <span class="stat">完成<b id="sDone" style="color:var(--green)">-</b></span>
  <span class="clock" id="clock">--:--:--</span>
</header>

<div class="input-bar">
  <input id="docInput" placeholder="输入: ID owner 负责人 | 事项名 分配给 姓名 | 粘贴周报/邮件 (Enter)" onkeydown="if(event.key==='Enter')doIngest()">
  <select id="sourceSel"><option value="web">通用</option><option value="weekly-report">周报</option><option value="email">邮件</option><option value="meeting-minutes">会议</option></select>
  <button class="btn-go" onclick="doIngest()">执行</button>
  <button class="btn-cp" onclick="doCheckpoint()">🫀 心跳</button>
</div>

<main>
  <!-- ═══ 上排 ═══ -->
  <div class="top-row">
    <div class="panel" id="panel-board">
      <div class="panel-header">📊 决策看板 <span class="count" id="boardCount"></span>
        <span style="margin-left:auto;display:flex;gap:2px" id="boardTabs">
          <span class="board-tab active" onclick="setBoardFilter('active')">活跃</span>
          <span class="board-tab" onclick="setBoardFilter('all')">全部</span>
        </span>
      </div>
      <div class="panel-body nopad"><div style="padding:4px 8px" id="decisionBoard"></div></div>
    </div>
    <div class="panel" id="panel-alerts">
      <div class="panel-header">🔔 告警与通知<span class="count" id="alertCount"></span></div>
      <div class="panel-body" id="alertBody"><div style="color:var(--dim)">—</div></div>
    </div>
  </div>

  <!-- ═══ 中排: HermiT ═══ -->
  <div class="panel">
    <div class="panel-header">🧠 本体推理引擎 <span class="count" id="hermitCount"></span></div>
    <div class="panel-body" id="hermitBody"></div>
  </div>

  <!-- ═══ 下排: 事件日志 ═══ -->
  <div class="panel" style="flex:1;min-height:140px">
    <div class="panel-header">📋 事件日志
      <span class="log-tabs" style="margin-left:8px">
        <span class="log-tab active" onclick="setLogFilter('all')" data-filter="all">全部</span>
        <span class="log-tab" onclick="setLogFilter('alert')" data-filter="alert">🔔告警</span>
        <span class="log-tab" onclick="setLogFilter('ingest')" data-filter="ingest">📥提取</span>
        <span class="log-tab" onclick="setLogFilter('amend')" data-filter="amend">✏️修改</span>
      </span>
    </div>
    <div class="panel-body" id="eventLog"><div style="color:var(--dim)">等待事件…</div></div>
  </div>
</main>

<div class="detail-overlay" id="detailPanel"><span class="close" onclick="closeDetail()">✕</span><div id="detailContent"></div></div>

<script>
// ── Labels ──
const L={
  status:{OPEN:'待处理',BLOCKED:'已阻塞',RUNNING:'进行中',DONE:'已完成'},
  risk:{HIGH:'高',MEDIUM:'中',LOW:'低'},
  sev:{ERROR:'❌',WARNING:'⚠',OK:'✓'},
  alert:{HIGH:'高危',MEDIUM:'中危'},
  icon:{OPEN:'○',BLOCKED:'⊘',RUNNING:'◉',DONE:'✓'},
  field:{MISSING_OWNER:'缺负责人',MISSING_DEADLINE:'缺截止',MISSING_UPDATE:'无进展',STALE:'停滞'},
  atype:{OVERDUE:'超期',HIGH_RISK:'高风险',STALE:'停滞',NO_PROGRESS:'无进展',BLOCKED:'已阻塞'}
};
function fd(d){return d?d.substring(0,10):'—'}
function flu(d){
  if(!d)return'—';
  try{const dt=new Date(d);const now=new Date();const diff=now-dt;
    if(diff<86400000)return dt.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    if(diff<604800000)return`${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    return d.substring(0,10)}
  catch(e){return d.substring(0,10)}
}
function ff(f){return L.field[f]||f}

let state={decisions:[],compile:[],hermit:{},alerts:[],stats:{}};
const PO={P0:0,P1:1,P2:2,P3:3,P4:4};
let boardFilter='active', logFilter='all', allLogEntries=[];
let _refreshGate=false, _debounceTimer=null;

setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN'),1000);

async function refreshAll(){
  if(_refreshGate)return;
  _refreshGate=true;
  try{const d=await (await fetch('/api/dashboard')).json();state={decisions:d.decisions||[],compile:d.compile||[],hermit:d.hermit||{},alerts:d.alerts||[],stats:d.stats||{}};renderAll()}catch(e){}finally{_refreshGate=false}
}

function scheduleRefresh(){
  if(_debounceTimer)clearTimeout(_debounceTimer);
  _debounceTimer=setTimeout(refreshAll,300);
}
function renderAll(){buildIndexes();renderBoard();renderHermit();renderAlerts();renderStatus()}

let alertMap={},compileMap={},governedSet=new Set();
function buildIndexes(){
  alertMap={};compileMap={};governedSet=new Set();
  state.alerts.forEach(a=>{if(!alertMap[a.decision_id])alertMap[a.decision_id]=[];alertMap[a.decision_id].push(a)});
  state.compile.forEach(c=>{const o=compileMap[c.decision_id];if(!o||c.severity==='ERROR'||(c.severity==='WARNING'&&o.severity!=='ERROR'))compileMap[c.decision_id]=c});
  (state.hermit.governed||[]).forEach(d=>governedSet.add(d));
}

// ── Decision Board ──
function setBoardFilter(f){boardFilter=f;document.querySelectorAll('.board-tab').forEach(t=>t.classList.toggle('active',t.textContent.trim()===(f==='active'?'活跃':'全部')));renderBoard()}
function renderBoard(){
  let decs=[...state.decisions];
  if(boardFilter==='active')decs=decs.filter(d=>d.status!=='DONE');
  decs.sort((a,b)=>{const pa=PO[a.priority||'P4'],pb=PO[b.priority||'P4'];if(pa!==pb)return pa-pb;if(a.risk_level==='HIGH'&&b.risk_level!=='HIGH')return -1;if(b.risk_level==='HIGH')return 1;if(a.status==='DONE')return 1;if(b.status==='DONE')return -1;return 0});
  document.getElementById('decisionBoard').innerHTML=decs.map(d=>{
    const p=d.priority||'P4';const a=alertMap[d.id]||[];const nA=a.length;
    const dot=nA>0?`<span class="alert-dot alert-dot-${a.some(x=>x.severity==='HIGH')?'HIGH':'MEDIUM'}"></span>`:'';
    const pct=d.progress||0;const pC=pct>=80?'var(--green)':pct>=40?'var(--accent)':'var(--yellow)';
    const done=d.status==='DONE';
    const riskColor=d.risk_level==='HIGH'?'var(--red)':d.risk_level==='MEDIUM'?'var(--yellow)':'var(--dim)';
    return `<div class="decision-row ${buildRowClass(d)}${done?' done':''}" data-did="${d.id}" onclick="showDetail('${d.id}')" title="${riskTip(d)}">
      <span class="sdot dot-${d.status}"></span>${dot}
      <span class="title${nA>0?' alerted':''}">${L.icon[d.status]} ${d.title}</span>
      <span class="badge bg-${p.toLowerCase()}" style="flex-shrink:0">${p}</span>
      <span class="pbar"><span class="pbar-fill" style="width:${done?100:pct}%;background:${pC}"></span></span>
      <span style="font-size:10px;width:22px;text-align:center;flex-shrink:0;color:${riskColor};font-weight:600">${L.risk[d.risk_level]}</span>
      <span style="font-size:10px;color:var(--dim);width:48px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${d.owner||'未分配'}">${d.owner||'—'}</span>
      <span style="font-size:9px;color:var(--dim);width:52px;text-align:right;flex-shrink:0" title="${d.last_update_at||'从未更新'}">${flu(d.last_update_at)}</span>
    </div>`}).join('');
  document.getElementById('boardCount').textContent=`${decs.filter(d=>d.status!=='DONE').length}活跃`;
  document.getElementById('panel-board').classList.toggle('highlight',state.compile.some(c=>c.severity==='ERROR'));
}
function buildRowClass(d){const c=compileMap[d.id];const a=alertMap[d.id]||[];const cls=[];if(c&&c.severity==='ERROR')cls.push('error');else if(c&&c.severity==='WARNING')cls.push('warning');else if(governedSet.has(d.id))cls.push('ok');if(a.some(x=>x.severity==='HIGH'))cls.push('error');return cls.join(' ')}
function riskTip(d){const a=alertMap[d.id]||[];const c=compileMap[d.id];if(d.risk_level!=='HIGH')return'';if(a.find(x=>x.alert_type==='OVERDUE'))return'⏰ 超期自动升级';if(a.find(x=>x.alert_type==='BLOCKED'))return'🚫 阻塞自动升级';if(c&&c.severity==='ERROR')return'⚠ 本体推理升级';return'📌 初始高风险'}

// ── Alerts Panel ──
function renderAlerts(){
  const el=document.getElementById('alertBody');const alerts=state.alerts;const compile=state.compile;
  const noOwner=compile.filter(c=>c.severity==='ERROR');
  const warns=compile.filter(c=>c.severity==='WARNING'||c.issue_type==='MISSING_DEADLINE');
  const totalIssues=noOwner.length+alerts.length+warns.length;
  if(!totalIssues){el.innerHTML='<div style="color:var(--dim);font-size:10px">✓ 系统正常 — 所有决策治理检查通过</div>';document.getElementById('alertCount').textContent='';document.getElementById('panel-alerts').classList.remove('highlight');return}
  document.getElementById('alertCount').textContent=`${totalIssues}条`;
  let h='';
  if(noOwner.length){h+=`<div class="box error"><div class="st">📢 缺失负责人 — ${noOwner.length}项</div>`;h+=noOwner.map(c=>`<div class="notif-row"><span class="icon">⚡</span><span style="color:var(--red);flex:1;cursor:pointer" onclick="showDetail('${c.decision_id}')">${c.decision_title}</span></div>`).join('');h+=`</div>`}
  if(warns.length){h+=`<div class="box" style="border-color:var(--yellow)"><div class="st">⚠ 治理警告 — ${warns.length}项</div>`;h+=warns.slice(0,8).map(c=>`<div class="notif-row"><span class="icon">⚠</span><span style="color:var(--yellow);flex:1;cursor:pointer" onclick="showDetail('${c.decision_id}')">${c.decision_title} <span style="font-size:9px;color:var(--dim)">${ff(c.issue_type)}</span></span></div>`).join('');h+=`</div>`}
  const seen=new Set();
  h+=alerts.filter(a=>{const k=a.decision_id;if(seen.has(k))return false;seen.add(k);return true}).map(a=>`<div class="alert-card alert-${a.severity}" onclick="showDetail('${a.decision_id}')">[${L.alert[a.severity]}] ${a.decision_title}<br><span style="color:var(--dim);font-size:9px">${L.atype[a.alert_type]||a.message}</span></div>`).join('');
  el.innerHTML=h;
  document.getElementById('panel-alerts').classList.toggle('highlight',alerts.some(a=>a.severity==='HIGH')||noOwner.length>0);
}

// ── HermiT ──
function renderHermit(){
  const h=state.hermit;const el=document.getElementById('hermitBody');
  if(!h||h.governed===undefined){el.innerHTML='<div style="color:var(--dim);font-size:10px">本体推理引擎离线 (fallback 模式)</div>';return}
  const errs=state.compile.filter(c=>c.severity==='ERROR');
  const wrns=state.compile.filter(c=>c.severity==='WARNING');
  const governed=state.compile.filter(c=>c.issue_type==='OK'&&c.severity==='OK');
  const total=state.decisions.length||1;

  // Status bar
  let html=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:10px;color:var(--green)"><span class="dot" style="width:6px;height:6px;background:var(--green);animation:pulse 2s infinite;display:inline-block;border-radius:50%"></span>本体推理引擎运行中 — 基于OWL分类推理</div>`;

  // 3-stat cards — stable, based on compile data
  html+=`<div class="hermit-stats">`;
  html+=`<div class="hermit-stat" title="已通过所有治理检查（有负责人+有截止+有进展）的决策" onclick="filterBoardByStatus('governed')"><div class="num" style="color:var(--green)">${governed.length}</div><div class="label">治理完备</div></div>`;
  html+=`<div class="hermit-stat warn" title="存在警告的决策（缺截止日期/无进展/停滞）" onclick="filterBoardByStatus('warning')"><div class="num" style="color:var(--yellow)">${wrns.length}</div><div class="label">需关注</div></div>`;
  html+=`<div class="hermit-stat err" title="存在错误的决策（缺负责人）" onclick="filterBoardByStatus('error')"><div class="num" style="color:var(--red)">${errs.length}</div><div class="label">需处理</div></div></div>`;

  // Priority spectrum — fixed position
  html+=`<div class="priority-wrap">`;
  const bp=state.stats.by_priority||{};const order=['P0','P1','P2','P3','P4'];
  const colors={P0:'var(--p0)',P1:'var(--p1)',P2:'var(--p2)',P3:'var(--p3)',P4:'var(--p4)'};
  html+=`<div class="st">🎯 优先级分布 <span style="font-weight:400;font-size:9px">P0最高 → P4最低</span></div>`;
  html+=`<div class="priority-spectrum">`;
  html+=order.map(p=>{const c=bp[p]||0;const w=Math.max(0.5,Math.round(c/total*1000)/10);return `<div class="pseg${c===0?' empty':''}" style="width:${w}%;background:${colors[p]}" title="${p}: ${c} 个决策">${c>0?`${p}:${c}`:''}</div>`}).join('');
  html+=`</div></div>`;

  // Compile checks — stable max-height scroll
  html+=`<div class="compile-wrap">`;
  html+=`<div class="st">📋 编译检查</div>`;
  if(!errs.length&&!wrns.length)html+=`<div style="color:var(--green);font-size:10px">✓ 全部通过 — 所有决策满足本体约束</div>`;
  else html+=errs.concat(wrns).slice(0,12).map(c=>`<div class="compile-line" style="color:${c.severity==='ERROR'?'var(--red)':'var(--yellow)'}" data-did="${c.decision_id}" onmouseenter="highlightDecision('${c.decision_id}',true)" onmouseleave="highlightDecision('${c.decision_id}',false)" onclick="showDetail('${c.decision_id}')">${L.sev[c.severity]} ${c.decision_title} <span style="color:var(--dim);font-size:9px">${ff(c.issue_type)}</span></div>`).join('');
  html+=`</div>`;

  el.innerHTML=html;
  document.getElementById('hermitCount').textContent=`${governed.length}/${total} 治理完备`;
}

function filterBoardByStatus(type){
  if(type==='governed'){alert('治理完备: 已通过所有治理检查的决策');return}
  if(type==='error'){alert('需处理: 缺失负责人的决策 — 请点击下方编译检查中的条目查看详情');return}
  if(type==='warning'){alert('需关注: 存在警告的决策（缺截止/无进展/停滞）');return}
}

// ── Event Log ──
function setLogFilter(f){logFilter=f;document.querySelectorAll('.log-tab').forEach(t=>t.classList.toggle('active',t.textContent.includes(f==='all'?'全部':f==='alert'?'告警':f==='ingest'?'提取':'修改')));renderLog()}
function renderLog(){
  const el=document.getElementById('eventLog');
  const entries=logFilter==='all'?allLogEntries:allLogEntries.filter(e=>e.cat===logFilter||(logFilter==='alert'&&e.lv==='error'));
  el.innerHTML=entries.length?entries.map(e=>`<div class="log-entry log-${e.lv}${e.cat==='ingest'||e.cat==='alert'?' log-highlight':''}"><span class="ts">${e.ts}</span>${e.msg}</div>`).join(''):'<div style="color:var(--dim);padding:4px">暂无此类事件</div>';
}
function addLog(lv,msg,cat){
  const ts=new Date().toLocaleTimeString('zh-CN');
  allLogEntries.unshift({ts,lv,msg,cat:cat||''});
  if(allLogEntries.length>500)allLogEntries.length=500;
  if(logFilter==='all'||cat===logFilter||(logFilter==='alert'&&lv==='error'))renderLog();
}

// ── Actions ──
async function doIngest(){
  const inp=document.getElementById('docInput');const text=inp.value.trim();if(!text)return;inp.value='';
  let intent;try{const r=await fetch('/api/agent/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});intent=await r.json()}catch(e){intent={intent:'INGEST'}}
  if(intent.intent==='AMEND'&&intent.decision_id){const body={};body[intent.field||'owner']=intent.value;try{await fetch(`/api/decisions/${intent.decision_id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});addLog('info','✅ 已更新','amend')}catch(e){addLog('error','❌ 更新失败')}refreshAll();return}
  if(intent.intent==='CHECKPOINT'){doCheckpoint();return}
  addLog('info','📥 提交至Agent提取…','ingest');const source=document.getElementById('sourceSel').value;
  try{const r=await fetch('/api/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,source})});const d=await r.json();if(d.decisions?.length){const titles=d.decisions.map(d=>d.title).join(', ');addLog('info',`✅ 提取${d.decisions.length}个决策: ${titles}`,'ingest')}else addLog('warn','⚠ Agent提取未返回结果（LLM响应超时或不可达）')}catch(e){addLog('error','❌ 请求失败: '+e.message)}
  refreshAll();
}
async function doCheckpoint(){addLog('info','🫀 治理心跳','sync');try{const r=await fetch('/api/checkpoint',{method:'POST'});const d=await r.json();if(d.alerts?.length)addLog('error',`🔔 ${d.alerts.length}个告警`,'alert');refreshAll()}catch(e){}}

function renderStatus(){const s=state.stats;if(!s)return;document.getElementById('sTotal').textContent=s.total_decisions||0;document.getElementById('sHigh').textContent=s.high_risk_count||0;document.getElementById('sOverdue').textContent=s.overdue_count||0;document.getElementById('sDone').textContent=(s.total_decisions||0)-(s.active_decisions||0)}
function highlightDecision(did,on){document.querySelectorAll(`[data-did="${did}"]`).forEach(el=>{el.style.background=on?'rgba(77,166,255,.08)':''})}

async function showDetail(did){
  const d=state.decisions.find(x=>x.id===did);if(!d)return;const p=d.priority||'P4';const ci=compileMap[did];const da=(alertMap[did]||[]);
  // Compute risk reason
  let riskReason='';
  if(d.risk_level==='HIGH'){
    const overdue=da.find(a=>a.alert_type==='OVERDUE');
    const depAlerts=da.filter(a=>a.alert_type==='BLOCKED');
    if(overdue)riskReason='截止日期已超期, 自动升级为高风险';
    else if(depAlerts.length)riskReason='被阻塞, 自动升级为高风险';
    else if(ci&&ci.severity==='ERROR')riskReason='本体推理: 缺失负责人 + 超期 → 自动升级';
    else riskReason='初始设定为高风险 (创建时指定)';
  }
  let h=`<h3>${d.title}</h3>`;
  h+=`<div class="detail-field"><span class="label">编号</span>${d.id}</div>`;
  h+=`<div class="detail-field"><span class="label">状态</span><span class="sdot dot-${d.status}"></span>${L.status[d.status]}</div>`;
  h+=`<div class="detail-field"><span class="label">优先级</span><span class="badge bg-${p.toLowerCase()}">${p}</span></div>`;
  h+=`<div class="detail-field"><span class="label">风险</span><span class="risk-${d.risk_level}">${L.risk[d.risk_level]}</span></div>`;
  if(riskReason)h+=`<div style="font-size:10px;color:var(--dim);padding:2px 0 2px 64px">↳ ${riskReason}</div>`;
  h+=`<div class="detail-field"><span class="label">进度</span>${d.progress||0}%</div>`;
  h+=`<div class="detail-field"><span class="label">负责人</span>${d.owner||'<span style=\"color:var(--red)\">未分配</span>'}</div>`;
  h+=`<div class="detail-field"><span class="label">截止</span>${fd(d.deadline)}</div>`;
  h+=`<div class="detail-field"><span class="label">创建</span>${fd(d.created_at)}</div>`;
  h+=`<div class="detail-field"><span class="label">来源</span>${d.source||'—'}</div>`;
  if(d.raw_statement)h+=`<div style="margin-top:4px;padding:4px 6px;background:rgba(255,255,255,.02);border-radius:3px;font-size:10px;color:var(--dim)">📝 ${d.raw_statement}</div>`;
  if(ci)h+=`<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border)"><span style="font-size:10px;color:var(--dim)">编译检查</span><div style="font-size:10px;color:${ci.severity==='ERROR'?'var(--red)':'var(--yellow)'}">${L.sev[ci.severity]} ${ff(ci.issue_type)}</div></div>`;
  if(da.length)h+=`<div style="margin-top:6px"><span style="font-size:10px;color:var(--dim)">当前告警</span>${da.map(a=>`<div class="alert-card alert-${a.severity}" style="margin-top:2px">[${L.alert[a.severity]}] ${L.atype[a.alert_type]||a.message}</div>`).join('')}</div>`;
  // Update timeline
  try{const r=await fetch(`/api/decisions/${did}`);const data=await r.json();const ups=data.updates||[];
  if(ups.length){
    h+=`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-size:10px;color:var(--dim);font-weight:700">📋 更新记录 (${ups.length})</span>`;
    h+=ups.slice(0,15).map(u=>{
      const srcLabel={cli:'CLI',web:'Web',ingest:'提取'}[u.source]||u.source||'—';
      const srcCls={cli:'src-cli',web:'src-web',ingest:'src-ingest'}[u.source]||'';
      let delta='';
      if(u.progress!=null)delta+=`<span class="${(u.progress||0)>=50?'delta-up':'delta-down'}">进度→${u.progress}%</span> `;
      if(u.risk)delta+=`<span style="color:var(--yellow)">风险→${L.risk[u.risk]||u.risk}</span>`;
      return `<div class="detail-update"><span class="ts">${new Date(u.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><span class="src-badge ${srcCls}">${srcLabel}</span><br>${u.content||'(无内容)'}${delta?`<div class="delta">${delta}</div>`:''}</div>`}).join('');
    h+=`</div>`}
  }catch(e){}
  document.getElementById('detailContent').innerHTML=h;document.getElementById('detailPanel').classList.add('open')
}
function closeDetail(){document.getElementById('detailPanel').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

const evt=new EventSource('/api/events/stream');
['decision_created','decision_updated'].forEach(t=>evt.addEventListener(t,()=>scheduleRefresh()));
evt.addEventListener('alert_triggered',e=>{try{const d=JSON.parse(e.data);addLog('error',`🔔 ${d.data?.decision_id} ${d.data?.alert_type}`,'alert')}catch(ex){}scheduleRefresh()});
evt.addEventListener('data_changed',async()=>{addLog('sync','🔄 CLI操作 → 自动同步','sync');scheduleRefresh();await loadRecentEvents()});
evt.addEventListener('data_reset',async()=>{allLogEntries=[];renderLog();scheduleRefresh();await loadRecentEvents()});

async function loadRecentEvents(){
  try{const r=await fetch('/api/events?limit=100');const events=await r.json();
    // If CLI reset the data, clear all log entries before reloading
    if(events.some(e=>e.type==='data_reset')){allLogEntries=[];renderLog()}
    const existing=new Set(allLogEntries.map(e=>`${e.ts}${e.msg}`));
    events.reverse().forEach(e=>{const lv=e.severity==='high'?'error':e.severity==='warning'?'warn':'info';const t=e.timestamp?new Date(e.timestamp).toLocaleTimeString('zh-CN'):'';const d=e.data||{};
    let msg=e.type;
    if(e.type==='alert_triggered')msg=`🔔 ${d.alert_type} — ${d.decision_title||d.decision_id}`;
    else if(e.type==='decision_created')msg=`📝 决策创建: ${d.title||d.id} — ${d.owner||'无负责人'}`;
    else if(e.type==='decision_updated')msg=`✏️ 决策更新: ${d.title||d.id} (${d.field==='assignment'?'分配负责人':'状态更新'})`;
    else if(e.type==='data_changed')msg='🔄 数据同步';
    else if(e.type==='data_reset')msg='🗑️ 数据已重置';
    else msg=`${e.type}: ${JSON.stringify(d).substring(0,60)}`;
    const key=`${t}${msg}`;
    if(!existing.has(key)){allLogEntries.push({ts:t,lv,msg,cat:e.type});existing.add(key)};
  });renderLog()}catch(e){console.error('loadRecentEvents error:',e)}
}
document.addEventListener('DOMContentLoaded',async()=>{
  await loadRecentEvents();
  refreshAll();setInterval(refreshAll,5000)});
</script>
